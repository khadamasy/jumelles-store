services:
  # ==========================================
  # 1. Base de données PostgreSQL
  # ==========================================
  postgres:
    image: postgres:16.3-alpine
    container_name: jumelles-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jumelles_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definissez POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-jumelles_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jumelles_admin} -d ${POSTGRES_DB:-jumelles_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jumelles-network

  # ==========================================
  # 2. Stockage d'objets MinIO (Images & Médias)
  # ==========================================
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: jumelles-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Definissez MINIO_ROOT_USER dans .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Definissez MINIO_ROOT_PASSWORD dans .env}
    ports:
      - "127.0.0.1:9000:9000"   # API S3 (accès interne uniquement)
      - "127.0.0.1:9001:9001"   # Console Web (accès local uniquement)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jumelles-network

  # Script d'initialisation des buckets MinIO
  minio-init:
    image: minio/mc:RELEASE.2024-06-12T14-34-03Z
    container_name: jumelles-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb myminio/jumelles-products --ignore-existing;
      /usr/bin/mc mb myminio/jumelles-invoices --ignore-existing;
      /usr/bin/mc anonymous set download myminio/jumelles-products;
      exit 0;
      "
    networks:
      - jumelles-network

  # ==========================================
  # 3. API Backend Node.js / Express
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jumelles-backend
    restart: always
    environment:
      PORT: 4000
      NODE_ENV: production
      # Chaîne de proxys : Caddy (HTTPS) -> Nginx (frontend) -> backend
      TRUST_PROXY: "2"
      SITE_URL: "https://${SITE_DOMAIN:?Definissez SITE_DOMAIN dans .env}"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Definissez ADMIN_PASSWORD dans .env}
      JWT_SECRET: ${JWT_SECRET:?Definissez JWT_SECRET dans .env (32 caracteres minimum)}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://${SITE_DOMAIN}}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      # Notifications de nouvelles commandes (optionnel, voir README)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Annulation automatique des commandes non confirmées (stock libéré)
      PENDING_ORDER_TTL_HOURS: ${PENDING_ORDER_TTL_HOURS:-48}
      DATABASE_URL: postgresql://${POSTGRES_USER:-jumelles_admin}:${POSTGRES_PASSWORD:?Definissez POSTGRES_PASSWORD dans .env}@postgres:5432/${POSTGRES_DB:-jumelles_db}?schema=public
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Definissez MINIO_ROOT_USER dans .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Definissez MINIO_ROOT_PASSWORD dans .env}
      MINIO_BUCKET_PRODUCTS: jumelles-products
      # Photos servies par Nginx sous /jumelles-products/ (même domaine que le site).
      # Laisser vide sauf si les photos sont servies par un CDN / domaine dédié.
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-}
    volumes:
      - backend_data:/app/data
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - jumelles-network

  # ==========================================
  # 4. Application Frontend Vue.js 3 (Nginx)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SITE_URL: "https://${SITE_DOMAIN:?Definissez SITE_DOMAIN dans .env}"
    container_name: jumelles-frontend
    restart: always
    ports:
      - "127.0.0.1:3000:80"   # accès local uniquement : le public passe par Caddy (HTTPS)
    depends_on:
      - backend
    networks:
      - jumelles-network

  # ==========================================
  # 5. Caddy : HTTPS automatique (Let's Encrypt)
  # ==========================================
  caddy:
    image: caddy:2.8.4-alpine
    container_name: jumelles-caddy
    restart: always
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Definissez SITE_DOMAIN dans .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      - jumelles-network

  # ==========================================
  # 6. Sauvegardes quotidiennes (base + photos)
  # ==========================================
  backup:
    image: postgres:16.3-alpine
    container_name: jumelles-backup
    restart: always
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-jumelles_admin}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Definissez POSTGRES_PASSWORD dans .env}
      PGDATABASE: ${POSTGRES_DB:-jumelles_db}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
      - minio_data:/minio_data:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jumelles-network

networks:
  jumelles-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  backend_data:
  caddy_data:
  caddy_config:
