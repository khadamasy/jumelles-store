services:
  # ==========================================
  # 1. Base de données PostgreSQL
  # ==========================================
  postgres:
    image: postgres:16.3-alpine
    container_name: jumelles-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jumelles_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definissez POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-jumelles_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jumelles_admin} -d ${POSTGRES_DB:-jumelles_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jumelles-network

  # ==========================================
  # 2. Stockage d'objets MinIO (Images & Médias)
  # ==========================================
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: jumelles-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Definissez MINIO_ROOT_USER dans .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Definissez MINIO_ROOT_PASSWORD dans .env}
    ports:
      - "127.0.0.1:9000:9000"   # API S3 (accès interne uniquement)
      - "127.0.0.1:9001:9001"   # Console Web (accès local uniquement)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jumelles-network

  # Script d'initialisation des buckets MinIO
  minio-init:
    image: minio/mc:RELEASE.2024-06-12T14-34-03Z
    container_name: jumelles-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb myminio/jumelles-products --ignore-existing;
      /usr/bin/mc mb myminio/jumelles-invoices --ignore-existing;
      /usr/bin/mc anonymous set download myminio/jumelles-products;
      exit 0;
      "
    networks:
      - jumelles-network

  # ==========================================
  # 3. Serveur d'authentification Keycloak (IAM)
  # ==========================================
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: jumelles-keycloak
    restart: always
    command: start --import-realm --http-enabled=true --hostname-strict=false
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Definissez KEYCLOAK_ADMIN_PASSWORD dans .env}
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: ${POSTGRES_DB:-jumelles_db}
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-jumelles_admin}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Definissez POSTGRES_PASSWORD dans .env}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jumelles-network

  # ==========================================
  # 4. API Backend Node.js / Express
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jumelles-backend
    restart: always
    environment:
      PORT: 4000
      NODE_ENV: production
      TRUST_PROXY: "1"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Definissez ADMIN_PASSWORD dans .env}
      JWT_SECRET: ${JWT_SECRET:?Definissez JWT_SECRET dans .env (32 caracteres minimum)}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-jumelles_admin}:${POSTGRES_PASSWORD:?Definissez POSTGRES_PASSWORD dans .env}@postgres:5432/${POSTGRES_DB:-jumelles_db}?schema=public
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: jumelles-store
      KEYCLOAK_CLIENT_ID: jumelles-backend
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Definissez MINIO_ROOT_USER dans .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Definissez MINIO_ROOT_PASSWORD dans .env}
      MINIO_BUCKET_PRODUCTS: jumelles-products
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - jumelles-network

  # ==========================================
  # 5. Application Frontend Vue.js 3 (Nginx)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jumelles-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - jumelles-network

networks:
  jumelles-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
