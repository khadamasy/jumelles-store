server {
    listen 80;
    server_name _;
    server_tokens off;

    # IP réelle du client transmise par Caddy (HTTPS) : seule son adresse fixe est crue.
    # Sans Caddy, l'en-tête X-Forwarded-For envoyé par un visiteur est ignoré (anti-usurpation),
    # ce qui garde efficaces les limites anti-spam de l'API.
    set_real_ip_from 172.31.250.10;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    # Compression Gzip pour les performances réseau
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # En-têtes de sécurité du site (voir security-headers.conf)
    include /etc/nginx/snippets/security-headers.conf;

    client_max_body_size 6m;

    # Reverse-proxy vers l'API Backend Node.js
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Photos produits téléversées (bucket MinIO public en lecture seule)
    location /jumelles-products/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://minio:9000/jumelles-products/;
        proxy_set_header Host minio:9000;
        proxy_hide_header Set-Cookie;
        expires 30d;
    }

    # Plan du site généré dynamiquement par l'API (liste des articles actifs)
    location = /sitemap.xml {
        proxy_pass http://backend:4000/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # robots.txt généré par l'API avec le domaine configuré (PUBLIC_SITE_URL)
    location = /robots.txt {
        proxy_pass http://backend:4000/robots.txt;
        proxy_set_header Host $host;
    }

    # Cache long terme pour les bundles hachés de Vite
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Interdire l'accès aux fichiers cachés (.env, .git...)
    location ~ /\. {
        deny all;
        return 404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
